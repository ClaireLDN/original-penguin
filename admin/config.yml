backend:
  name: git-gateway
  branch: main

media_folder: assets/uploads
public_folder: /assets/uploads

publish_mode: simple

collections:
   # ---------- Posts du journal de bord ----------
  - name: posts
    label: "Posts (journal de bord)"
    files:
      - name: posts
        label: "Posts"
        file: content/posts.json
        fields:
          - name: posts
            label: "Posts"
            widget: list
            summary: "{{fields.title_fr}} ({{fields.date}})"
            fields:
              - { label: "Date", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false }
              - { label: "Titre (EN)", name: "title_en", widget: "string" }
              - { label: "Titre (FR)", name: "title_fr", widget: "string" }
              - { label: "Texte (EN)", name: "text_en", widget: "text" }
              - { label: "Texte (FR)", name: "text_fr", widget: "text" }
              - label: "Médias (ajoute autant d'éléments que nécessaire)"
                name: "media"
                widget: "list"
                required: false
                summary: "{{fields.file}}{{fields.youtube}}"
                fields:
                  - { label: "Fichier (photo ou vidéo mp4)", name: "file", widget: "file", required: false }
                  - { label: "OU lien YouTube", name: "youtube", widget: "string", required: false }
              - { label: "Lien Instagram du post", name: "instagram_url", widget: "string", required: false }
  # ---------- Équipe ----------
  - name: team
    label: "Équipe"
    files:
      - name: team
        label: "Équipe"
        file: content/team.json
        fields:
          - name: team
            label: "Membres"
            widget: list
            summary: "{{fields.name}}"
            fields:
              - { label: "Nom", name: "name", widget: "string" }
              - { label: "Rôle (EN)", name: "role_en", widget: "string" }
              - { label: "Rôle (FR)", name: "role_fr", widget: "string" }
              - { label: "Bio (EN)", name: "bio_en", widget: "text" }
              - { label: "Bio (FR)", name: "bio_fr", widget: "text" }
              - { label: "Photo", name: "photo", widget: "image", required: false }

  # ---------- Sponsors ----------
  - name: sponsors
    label: "Sponsors"
    files:
      - name: sponsors
        label: "Sponsors"
        file: content/sponsors.json
        fields:
          - name: sponsors
            label: "Sponsors"
            widget: list
            summary: "{{fields.name}}"
            fields:
              - { label: "Nom", name: "name", widget: "string" }
              - { label: "Niveau (EN)", name: "tier_en", widget: "string" }
              - { label: "Niveau (FR)", name: "tier_fr", widget: "string" }
              - { label: "Description (EN)", name: "description_en", widget: "text" }
              - { label: "Description (FR)", name: "description_fr", widget: "text" }
              - { label: "Logo", name: "logo", widget: "image", required: false }
              - { label: "Site web", name: "url", widget: "string", required: false }

  # ---------- Paramètres du site ----------
  - name: site
    label: "Paramètres du site"
    files:
      - name: site
        label: "Paramètres du site"
        file: content/site.json
        fields:
          - { label: "Email de contact", name: "email", widget: "string" }
          - { label: "Lien Instagram", name: "instagram_url", widget: "string" }
          - { label: "Identifiant Instagram", name: "instagram_handle", widget: "string" }
          - { label: "Nom de l'événement", name: "event_name", widget: "string" }
          - { label: "Date de l'événement", name: "event_date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false }
          - { label: "Début du projet", name: "project_start", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false }
